<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;900&family=Caveat:wght@500;700&display=swap"
    />
    <title>CEO of Self</title>
    <!-- Google tag (gtag.js) — Measurement ID substituted by Vite's native
         %VITE_NAME% index.html placeholder support (see src/lib/analytics.ts
         for the route-change/custom-event tracking that pairs with this). -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=%VITE_GA_MEASUREMENT_ID%"></script>
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }
      gtag('js', new Date())
      // send_page_view: false — this is a client-routed SPA, so the initial
      // automatic pageview would both double-count the first route and miss
      // every subsequent one. src/lib/analytics.ts reports pageviews itself
      // on every React Router navigation instead.
      gtag('config', '%VITE_GA_MEASUREMENT_ID%', { send_page_view: false })
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
